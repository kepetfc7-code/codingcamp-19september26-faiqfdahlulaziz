<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER BAR ===== -->
  <header class="top-bar">
    <div class="logo">⚡ Life Dashboard</div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <span class="theme-icon" id="themeIcon">🌙</span>
      <span id="themeLabel">Dark Mode</span>
    </button>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <main class="dashboard">

    <!-- CARD 1: Greeting + Clock (Full Width) -->
    <section class="card card-greeting">
      <div class="greeting-left">
        <p class="greeting-text" id="greetingText">Good Morning,</p>
        <div class="name-row">
          <h1 class="user-name" id="userName">User</h1>
          <button class="btn-icon" id="editNameBtn" aria-label="Edit name" title="Edit nama">✏️</button>
        </div>
        <div class="name-edit-form hidden" id="nameEditForm">
          <input type="text" class="input-field" id="nameInput" placeholder="Masukkan nama kamu..." maxlength="30" />
          <button class="btn btn-primary" id="saveNameBtn">Simpan</button>
          <button class="btn btn-ghost" id="cancelNameBtn">Batal</button>
        </div>
      </div>
      <div class="greeting-right">
        <div class="clock" id="clockDisplay">00:00:00</div>
        <div class="date" id="dateDisplay">Senin, 1 Januari 2024</div>
      </div>
    </section>

    <!-- MIDDLE ROW: Pomodoro + Todo -->
    <div class="middle-row">

      <!-- CARD 2: Focus Timer (Pomodoro) -->
      <section class="card card-timer">
        <h2 class="card-title">🍅 Focus Timer</h2>
        <p class="card-subtitle" id="timerLabel">Pomodoro Session</p>

        <div class="timer-display" id="timerDisplay">25:00</div>

        <div class="timer-mode-row">
          <button class="btn btn-mode active" id="modePomo" data-minutes="25" data-label="Pomodoro Session">Pomodoro</button>
          <button class="btn btn-mode" id="modeShort" data-minutes="5" data-label="Short Break">Short Break</button>
          <button class="btn btn-mode" id="modeLong" data-minutes="15" data-label="Long Break">Long Break</button>
        </div>

        <div class="timer-controls">
          <button class="btn btn-primary btn-lg" id="startBtn">▶ Start</button>
          <button class="btn btn-secondary btn-lg" id="stopBtn" disabled>⏸ Pause</button>
          <button class="btn btn-ghost btn-lg" id="resetBtn">↺ Reset</button>
        </div>

        <div class="timer-progress-wrap">
          <div class="timer-progress-bar" id="timerProgressBar"></div>
        </div>
      </section>

      <!-- CARD 3: To-Do List -->
      <section class="card card-todo">
        <h2 class="card-title">📋 To-Do List</h2>

        <div class="todo-input-row">
          <input
            type="text"
            class="input-field"
            id="todoInput"
            placeholder="Tambahkan tugas baru..."
            maxlength="80"
          />
          <button class="btn btn-primary" id="addTodoBtn">+ Tambah</button>
        </div>
        <p class="error-msg hidden" id="todoError"></p>

        <div class="todo-stats">
          <span id="todoStats">0 tugas · 0 selesai</span>
          <button class="btn-link" id="clearDoneBtn">Hapus selesai</button>
        </div>

        <ul class="todo-list" id="todoList">
          <!-- items injected by JS -->
        </ul>

        <p class="empty-state" id="todoEmpty">Belum ada tugas. Yuk mulai! 🎯</p>
      </section>

    </div><!-- end middle-row -->

    <!-- CARD 4: Quick Links (Full Width) -->
    <section class="card card-links">
      <h2 class="card-title">🔗 Quick Links</h2>

      <div class="links-form">
        <input type="text" class="input-field" id="linkName" placeholder="Nama link (cth: GitHub)" maxlength="30" />
        <input type="url" class="input-field" id="linkUrl" placeholder="URL (cth: https://github.com)" />
        <button class="btn btn-primary" id="addLinkBtn">+ Tambah Link</button>
      </div>
      <p class="error-msg hidden" id="linkError"></p>

      <div class="links-grid" id="linksGrid">
        <!-- link buttons injected by JS -->
      </div>

      <p class="empty-state" id="linksEmpty">Belum ada link. Tambahkan pintasan favoritmu! 🌐</p>
    </section>

  </main>

  <footer class="footer">
    <p>Made with ❤️ — Life Dashboard &copy; 2024</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
